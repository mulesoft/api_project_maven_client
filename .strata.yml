global:
  # change to your team/user email accordingly
  email-reply-to: asheoran@salesforce.com
  # default value is false, set to true to have only the committer emailed on a dev branch
  email-only-last-committer-on-dev-branch: false
  # default branch is master, omit if master is the appropriate branch for your repo
  production-branches:
    - master
stages:
  build:
    - step:
        name: api-project-maven-client-build
        # a list of available and approved images are present here:
        # https://confluence.internal.salesforce.com/display/ZEN/Docker+Images
        image: docker.repo.local.sfdc.net/sfci/docker-images/sfdc_centos7_jdk17_build
        user: 'root'
        workspace-mount-point: /tmp/project
        commands:
          - mvn clean install